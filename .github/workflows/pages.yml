# Publishes the website to GitHub Pages on every push to main.
#
# A project site is served from /<repo>/, so the build gets that base path.
# GitHub Pages serves .ts files as video, so the links agents follow to source
# files point at raw.githubusercontent.com, which serves them as text.

name: Publish the website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      # The site's real address and path, including any custom domain.
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the site
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          RAW_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        # Links for agents always use https, whatever the domain's redirect setting.
        run: SITE_URL="https://${PAGES_URL#*://}" node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
