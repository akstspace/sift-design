server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  gzip on;
  gzip_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Agent entry points: plain text, readable from anywhere.
  location = /llms.txt      { default_type text/plain; charset utf-8; add_header Access-Control-Allow-Origin * always; add_header X-Content-Type-Options nosniff always; }
  location = /llms-full.txt { default_type text/plain; charset utf-8; add_header Access-Control-Allow-Origin * always; add_header X-Content-Type-Options nosniff always; }

  # The raw reference. Source files are served as text so they read, never run.
  location /raw/ {
    types {
      text/markdown  md;
      text/plain     ts tsx mjs js css txt;
      application/json json;
      image/png      png;
      image/webp     webp;
      image/jpeg     jpg;
      video/mp4      mp4;
      video/webm     webm;
      image/svg+xml  svg;
      font/woff2     woff2;
    }
    default_type text/plain;
    charset utf-8;
    charset_types text/markdown text/plain application/json;
    add_header Access-Control-Allow-Origin * always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  # Live blocks and the component specimen: each is its own single-page app.
  location ~ ^/live/([a-z-]+)/ {
    try_files $uri $uri/ /live/$1/index.html;
  }

  # Hashed build assets never change.
  location ~* /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # The site itself: client-side routes fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
